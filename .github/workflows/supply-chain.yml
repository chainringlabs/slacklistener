name: Supply chain

on:
  pull_request:
  # Weekly full scan of main: pull requests fail only on vulnerabilities they
  # introduce, so this is where an advisory against an already-merged
  # dependency surfaces.
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@8257523ec32ecf78bb71af30090b87d5220ebe84 # v1.4.1
    secrets: inherit

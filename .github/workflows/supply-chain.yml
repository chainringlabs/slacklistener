name: Supply chain

on:
  pull_request:
  # Weekly full scan of main: pull requests fail only on vulnerabilities they
  # introduce, so this is where an advisory against an already-merged
  # dependency surfaces.
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
    secrets: inherit

name: Supply chain

on:
  pull_request:
  # Weekly full scan of main: pull requests fail only on vulnerabilities they
  # introduce, so this is where an advisory against an already-merged
  # dependency surfaces.
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@f8888baa2af7a041fe6a5a11f8fe0be182357cc3 # v1.2.1
    secrets: inherit
